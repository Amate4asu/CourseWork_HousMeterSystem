services:

  postgres:
    image: postgres:17
    container_name: housing-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: housing
      POSTGRES_USER: housing
      POSTGRES_PASSWORD: housing_password

    ports:
      - "5432:5432"

    volumes:
      - housing-postgres-data:/var/lib/postgresql/data

volumes:
  housing-postgres-data: